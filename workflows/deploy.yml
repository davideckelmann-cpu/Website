name: Build & Deploy to Bunny

# Läuft bei jedem Push auf den main-Branch (also bei jedem Upload deiner Änderungen)
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # erlaubt manuelles Auslösen im GitHub-Tab "Actions"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm ci || npm install

      - name: Seite bauen
        run: npm run build

      - name: Zu Bunny hochladen & Cache leeren
        uses: ayeressian/bunnycdn-storage-deploy@v2.4.6
        with:
          source: "dist"
          destination: ""              # Wurzel der Storage Zone
          storageZoneName: "${{ secrets.BUNNY_STORAGE_NAME }}"
          storagePassword: "${{ secrets.BUNNY_STORAGE_PASSWORD }}"
          accessKey: "${{ secrets.BUNNY_API_KEY }}"
          pullZoneId: "${{ secrets.BUNNY_PULL_ZONE_ID }}"
          upload: "true"
          remove: "true"               # löscht alte Dateien, die es nicht mehr gibt
          purgePullZone: "true"        # leert den Cache, damit Änderungen sofort sichtbar sind
          purgePullZoneDelay: "5"
          maxRetries: "5"
